[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vera-api"
version = "0.1.0"
description = "VERA evidence verification API"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "openai>=1.68,<3",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "uvicorn[standard]>=0.34,<1",
  "sqlalchemy[asyncio]>=2.0.36,<3",
  "greenlet>=3.1,<4",
  "alembic>=1.14,<2",
  "psycopg[binary]>=3.2,<4",
  "aiosqlite>=0.20,<1",
  "argon2-cffi>=23,<26",
  "email-validator>=2.2,<3",
  "python-multipart>=0.0.18,<1",
]

[project.optional-dependencies]
dev = ["httpx>=0.28,<1", "pytest>=8.3,<9", "pytest-asyncio>=0.25,<2"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["agents/prompts/*.md"]
