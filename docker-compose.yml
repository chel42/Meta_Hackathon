services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: vera
      POSTGRES_USER: vera
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vera -d vera"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: ./apps/api
    environment:
      MODEL_API_KEY: ${MODEL_API_KEY:-}
      META_BASE_URL: ${META_BASE_URL:-https://api.meta.ai/v1}
      META_MODEL: ${META_MODEL:-muse-spark-1.3}
      MOCK_PROVIDER: ${MOCK_PROVIDER:-1}
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      RUN_BUDGET_USD: ${RUN_BUDGET_USD:-0.50}
      TOKEN_INPUT_USD_PER_MILLION: ${TOKEN_INPUT_USD_PER_MILLION:-0}
      TOKEN_OUTPUT_USD_PER_MILLION: ${TOKEN_OUTPUT_USD_PER_MILLION:-0}
      SEARCH_USD: ${SEARCH_USD:-0}
      FALLBACK_MODEL_API_KEY: ${FALLBACK_MODEL_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
